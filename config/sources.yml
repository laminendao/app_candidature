# Sources interrogées chaque jour. Chaque source est appelée UNE fois pour tous les profils,
# avec l'union de leurs requêtes (search.queries). Le score est ensuite calculé par profil.
#
# Pour désactiver une source : enabled: false
# Pour ajouter un flux RSS quelconque : l'ajouter sous rss.feeds

since_days: 7          # ancienneté maximale des offres demandées aux API
delay_seconds: 1.0     # pause minimale entre deux requêtes vers un même site

# Ordre de préférence quand une même offre apparaît sur plusieurs sources
priority: [manuel, inria, cnrs, sfds, cesi, rss, email, france_travail, hellowork, adzuna]

sources:
  france_travail:
    enabled: false               # API « Offres d'emploi v2 » retirée du catalogue (oct. 2026) : accès sur demande via francetravail.io/contact. Repasser à true une fois l'accès accordé.
    # departements: ["75", "91"]   # laisser vide = France entière

  adzuna:
    enabled: true
    results_per_page: 50
    max_pages: 2
    max_calls: 120               # l'offre gratuite autorise 250 appels par jour

  cnrs:
    enabled: true
    bassins: [ile-de-france, aquitaine, alsace, centre-est, provence-corse, centre-limousin-poitou-charentes]

  inria:
    enabled: true

  sfds:
    enabled: true

  cesi:
    enabled: true

  hellowork:
    enabled: false               # robots.txt de Hellowork interdit la collecte (ses offres remontent via France Travail)
    regions: [ile-de-france]     # "" = France entière
    # Requêtes propres à Hellowork (une page par métier et par région).
    # Laisser vide pour réutiliser toutes les requêtes des profils.
    queries: [data analyst, data scientist, statisticien, ingenieur data, professeur de mathematiques]

  email:
    enabled: true
    # Alertes emploi reçues par mail (LinkedIn, Indeed, APEC, WTTJ…). Secrets : EMAIL_ADDRESS, EMAIL_APP_PASSWORD.
    imap_host: imap.gmail.com
    folder: Alertes emploi       # libellé Gmail où un filtre range les alertes (lu en lecture seule)
    days: 7                      # ancienneté maximale des mails lus
    max_messages: 300

  rss:
    enabled: true
    feeds: []
    # - id: exemple
    #   url: https://exemple.fr/offres.rss
    #   org: Exemple
    #   location: Paris
