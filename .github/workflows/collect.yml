name: Collecte des offres

on:
  schedule:
    - cron: "17 5 * * *"     # tous les jours vers 6 h 17 (heure de Paris en hiver)
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
    inputs:
      only:
        description: "Sources à lancer, séparées par des virgules (vide = toutes)"
        required: false
        default: ""
  push:
    paths:                    # recalcul immédiat quand un profil ou la config change
      - "profiles/**"
      - "config/**"
      - "collector/**"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Collecte
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python -m collector --only "${{ github.event.inputs.only }}"
          else
            python -m collector
          fi

      - name: Enregistrer les données
        run: |
          git config user.name "collecteur-offres"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte du $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
